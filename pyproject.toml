[project]
name = "graphhelp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anooaa", email = "leegaeun250@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
