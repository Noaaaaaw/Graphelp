[project]
name = "graphhelp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anooaa", email = "leegaeun250@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "passlib>=1.7.4",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "uvicorn>=0.52.1",
]

[project.scripts]
graphhelp = "graphhelp:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
